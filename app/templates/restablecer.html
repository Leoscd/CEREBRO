{% extends "base.html" %}
{% block title %}Nueva contraseña · {{ marca }}{% endblock %}
{% block content %}
<div class="auth-wrap card">
  <h2>Elegí una contraseña nueva</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  {% if token %}
  <form method="post" action="/restablecer" class="stack">
    <input type="hidden" name="token" value="{{ token }}">
    <label for="nueva">Nueva contraseña (mínimo 10 caracteres)</label>
    <input id="nueva" type="password" name="nueva" autocomplete="new-password" minlength="10" required>
    <label for="repetir">Repetila</label>
    <input id="repetir" type="password" name="repetir" autocomplete="new-password" minlength="10" required>
    <p><button class="btn">Guardar</button></p>
  </form>
  {% else %}<p><a href="/olvide">Pedir un link nuevo</a></p>{% endif %}
</div>
{% endblock %}
