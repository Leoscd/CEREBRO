# Gestor de proyectos · VPS (8 vCPU / 32 GB / 400 GB)
#   docker compose up -d                     app + postgres + worker
#   docker compose --profile dominio up -d   + Caddy con HTTPS
x-endurecido: &endurecido
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  onlyoffice:
    image: onlyoffice/documentserver:10.0.0.1
    profiles: ["onlyoffice"]
    restart: unless-stopped
    networks: [documentos]
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      - onlyoffice_datos:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
    mem_limit: 6g

  gotenberg:
    <<: *endurecido
    image: gotenberg/gotenberg:8.32.0
    networks: [conversion]
    environment:
      API_DISABLE_DOWNLOAD_FROM: "true"
      LIBREOFFICE_DENY_LIST: ".*"
      LIBREOFFICE_AUTO_START: "true"
      CHROMIUM_DISABLE_ROUTES: "true"
    read_only: true
    tmpfs: ["/tmp", "/home/gotenberg:uid=1001,gid=1001"]
    mem_limit: 2g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  postgres:
    <<: *endurecido
    image: pgvector/pgvector:pg16
    # Postgres necesita algunas capacidades para cambiar al usuario postgres al iniciar.
    cap_add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE", "FOWNER"]
    environment:
      POSTGRES_DB: gsp
      POSTGRES_USER: gsp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definí POSTGRES_PASSWORD en .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    # Sin puertos publicados: solo lo ven los contenedores de esta red.
    mem_limit: 4g
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsp -d gsp"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    <<: *endurecido
    build: .
    image: &imagen_gsp ${COMPOSE_PROJECT_NAME:-gsp}-app:local
    pull_policy: never
    env_file: .env
    networks: [default, conversion, documentos]
    environment: &entorno_gsp
      DATABASE_URL: postgresql://gsp:${POSTGRES_PASSWORD}@postgres:5432/gsp
      GOTENBERG_URL: http://gotenberg:3000
      DATA_DIR: data
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - ./data/archivos:/srv/app/data/archivos
      - ./data/correos:/srv/app/data/correos
    depends_on:
      postgres: { condition: service_healthy }
    # Solo localhost: Docker se saltea ufw, así que nunca 0.0.0.0.
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    mem_limit: 3g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *endurecido
    image: *imagen_gsp
    pull_policy: never
    command: python -m app.worker
    env_file: .env
    environment: *entorno_gsp
    networks: [default, conversion]
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - ./data/archivos:/srv/app/data/archivos
    depends_on:
      app: { condition: service_healthy }
    mem_limit: 1g
    pids_limit: 128

  caddy:
    <<: *endurecido
    networks: [default, documentos]
    image: caddy:2-alpine
    profiles: ["dominio"]
    cap_add: ["NET_BIND_SERVICE"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    mem_limit: 256m

networks:
  documentos:
    internal: true
  conversion:
    internal: true

volumes:
  onlyoffice_datos:
  onlyoffice_logs:
  caddy_data:
  caddy_config:
